<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Recursive Tree</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --page: #edf0f2;
      --surface: #ffffff;
      --surface-muted: #f6f7f8;
      --line: #d9dee2;
      --line-strong: #b8c1c8;
      --text: #172127;
      --muted: #65727b;
      --header: #202a30;
      --accent: #087f8c;
      --accent-hover: #066c77;
      --accent-soft: #dceff1;
      --success: #26734a;
      --success-soft: #e3f2e9;
      --warning: #9a5b00;
      --warning-soft: #fff0d8;
      --danger: #b62d38;
      --danger-soft: #fbe5e7;
      --purple: #77569a;
      font-family:
        "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei",
        system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--page);
      color: var(--text);
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      cursor: pointer;
    }

    button:disabled,
    select:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .app-header {
      min-height: 64px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--header);
      color: #f8fafb;
      border-bottom: 1px solid #11181c;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      position: relative;
      flex: 0 0 auto;
    }

    .brand-mark span {
      width: 10px;
      height: 10px;
      position: absolute;
      border: 2px solid #73c5cc;
      background: var(--header);
    }

    .brand-mark span:nth-child(1) {
      left: 14px;
      top: 1px;
    }

    .brand-mark span:nth-child(2) {
      left: 2px;
      bottom: 2px;
    }

    .brand-mark span:nth-child(3) {
      right: 2px;
      bottom: 2px;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: #73c5cc;
    }

    .brand-mark::before {
      width: 2px;
      height: 16px;
      left: 18px;
      top: 11px;
    }

    .brand-mark::after {
      width: 25px;
      height: 2px;
      left: 6px;
      top: 25px;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 680;
    }

    .brand-copy p {
      margin: 3px 0 0;
      color: #b9c3c9;
      font-size: 12px;
      line-height: 1.2;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      color: #c5cdd2;
      font-size: 12px;
    }

    .connection-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #8c989f;
      box-shadow: 0 0 0 3px rgba(140, 152, 159, 0.16);
    }

    .connection.connected .connection-dot {
      background: #54ba80;
      box-shadow: 0 0 0 3px rgba(84, 186, 128, 0.16);
    }

    .connection.disconnected .connection-dot {
      background: #ee707a;
      box-shadow: 0 0 0 3px rgba(238, 112, 122, 0.16);
    }

    .command-bar {
      min-height: 72px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .task-form {
      min-width: 0;
      display: flex;
      align-items: end;
      gap: 10px;
      flex: 1 1 auto;
    }

    .field {
      min-width: 150px;
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    select,
    button {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
    }

    select {
      width: 100%;
      padding: 0 34px 0 10px;
    }

    button {
      padding: 0 13px;
      font-weight: 620;
    }

    button:hover:not(:disabled) {
      border-color: #87959e;
      background: var(--surface-muted);
    }

    .primary {
      min-width: 94px;
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .primary:hover:not(:disabled) {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .danger {
      border-color: #d6a2a7;
      color: var(--danger);
    }

    .command-actions {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(72px, 1fr));
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      overflow: hidden;
    }

    .segmented button {
      min-height: 34px;
      border: 0;
      border-radius: 0;
      padding: 0 11px;
      color: var(--muted);
    }

    .segmented button + button {
      border-left: 1px solid var(--line-strong);
    }

    .segmented button.active {
      background: var(--accent-soft);
      color: #075f68;
    }

    .workspace {
      width: min(1680px, 100%);
      min-height: calc(100vh - 136px);
      margin: 0 auto;
      display: grid;
      grid-template-columns:
        minmax(300px, 0.9fr)
        minmax(440px, 1.35fr)
        minmax(310px, 0.9fr);
      gap: 1px;
      background: var(--line);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .panel {
      min-width: 0;
      background: var(--surface);
    }

    .panel-section {
      padding: 17px;
      border-bottom: 1px solid var(--line);
    }

    .panel-section:last-child {
      border-bottom: 0;
    }

    .section-heading {
      min-height: 24px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading h2 {
      margin: 0;
      color: #35434b;
      font-size: 13px;
      line-height: 1.3;
      font-weight: 720;
    }

    .metric {
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: #e9edef;
      color: #53616a;
      font-size: 11px;
      font-weight: 680;
    }

    .status-pill.running,
    .node-status.running {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-pill.succeeded,
    .node-status.succeeded {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-pill.failed,
    .status-pill.error,
    .node-status.failed,
    .node-status.error {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .map-frame {
      width: 100%;
      aspect-ratio: 10 / 8;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: #f8fafb;
    }

    #world-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .legend {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 13px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    .swatch.robot {
      background: #157a9b;
    }

    .swatch.object {
      border-radius: 50%;
      background: #d64d55;
    }

    .swatch.region {
      border-color: #3c9162;
      background: #dff2e7;
    }

    .swatch.obstacle {
      background: #64727b;
    }

    .entity-list {
      display: grid;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .entity-row {
      min-width: 0;
      padding: 9px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      background: var(--surface);
    }

    .entity-name {
      overflow: hidden;
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entity-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .entity-pose {
      align-self: center;
      color: #47555e;
      font-family: Consolas, monospace;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .tree-panel {
      min-height: 620px;
      display: flex;
      flex-direction: column;
    }

    .tree-toolbar {
      flex: 0 0 auto;
    }

    .tree-scroll {
      min-height: 420px;
      max-height: calc(100vh - 225px);
      overflow: auto;
      flex: 1 1 auto;
      background:
        linear-gradient(#fafbfb, #fafbfb) padding-box;
    }

    .tree-empty,
    .list-empty {
      padding: 24px 17px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .tree-row {
      --depth: 0;
      min-height: 48px;
      padding: 7px 12px 7px calc(14px + var(--depth) * 20px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      position: relative;
      border-bottom: 1px solid #e8ecee;
      background: var(--surface);
    }

    .tree-row:hover {
      background: #f7f9fa;
    }

    .tree-row.repair {
      box-shadow: inset 3px 0 0 var(--purple);
    }

    .tree-row::before {
      content: "";
      width: 8px;
      height: 8px;
      position: absolute;
      left: calc(6px + var(--depth) * 20px);
      top: 19px;
      border: 2px solid #91a0a8;
      background: var(--surface);
    }

    .tree-row.repair::before {
      border-color: var(--purple);
    }

    .tree-copy {
      min-width: 0;
    }

    .tree-title {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 12px;
      font-weight: 680;
    }

    .repair-label {
      flex: 0 0 auto;
      color: var(--purple);
      font-size: 10px;
      font-weight: 700;
    }

    .tree-id {
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-runtime {
      display: grid;
      justify-items: end;
      gap: 3px;
    }

    .node-status {
      min-width: 54px;
      padding: 3px 6px;
      border-radius: 3px;
      background: #ebeff1;
      color: #53616a;
      font-size: 9px;
      font-weight: 720;
      text-align: center;
    }

    .attempts {
      color: var(--muted);
      font-size: 9px;
    }

    .side-panel {
      min-height: 620px;
    }

    .history-list,
    .event-list {
      display: grid;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }

    .history-item,
    .event-item {
      min-width: 0;
      padding: 9px 10px;
      background: var(--surface);
    }

    .history-line,
    .event-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .history-task,
    .event-type {
      min-width: 0;
      overflow: hidden;
      font-size: 11px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-meta,
    .event-node {
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-family: Consolas, monospace;
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event-sequence {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .event-scroll {
      max-height: calc(100vh - 475px);
      min-height: 210px;
      overflow: auto;
    }

    .artifact-path {
      overflow-wrap: anywhere;
      color: #46545d;
      font-family: Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
    }

    .toast {
      max-width: min(440px, calc(100vw - 30px));
      padding: 10px 13px;
      position: fixed;
      right: 15px;
      bottom: 15px;
      z-index: 10;
      display: none;
      border: 1px solid #d39ba1;
      border-radius: 4px;
      background: var(--danger-soft);
      color: var(--danger);
      box-shadow: 0 8px 24px rgba(32, 42, 48, 0.18);
      font-size: 12px;
    }

    .toast.visible {
      display: block;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: minmax(300px, 0.85fr) minmax(440px, 1.15fr);
      }

      .side-panel {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .event-scroll {
        max-height: 320px;
      }
    }

    @media (max-width: 820px) {
      .command-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .task-form {
        align-items: stretch;
      }

      .command-actions {
        flex-wrap: wrap;
      }

      .workspace {
        display: block;
        min-height: auto;
        border: 0;
      }

      .panel,
      .tree-panel,
      .side-panel {
        min-height: 0;
        border-bottom: 1px solid var(--line);
      }

      .side-panel {
        display: block;
      }

      .tree-scroll,
      .event-scroll {
        max-height: 520px;
      }
    }

    @media (max-width: 560px) {
      .app-header {
        padding: 10px 13px;
      }

      .brand-copy p {
        display: none;
      }

      .command-bar {
        padding: 12px 13px;
      }

      .task-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }

      .field {
        min-width: 0;
      }

      .task-form .primary {
        grid-column: 1 / -1;
      }

      .command-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .segmented {
        grid-column: 1 / -1;
      }

      .panel-section {
        padding: 14px 13px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <div class="brand-copy">
        <h1>Task Recursive Tree</h1>
        <p>移动操作任务持续执行控制台</p>
      </div>
    </div>
    <div class="connection" id="connection">
      <span class="connection-dot"></span>
      <span id="connection-label">连接中</span>
    </div>
  </header>

  <section class="command-bar">
    <form class="task-form" id="task-form">
      <div class="field">
        <label for="object-select">抓取对象</label>
        <select id="object-select" required></select>
      </div>
      <div class="field">
        <label for="destination-select">放置区域</label>
        <select id="destination-select" required></select>
      </div>
      <button class="primary" id="execute-button" type="submit">执行任务</button>
    </form>
    <div class="command-actions">
      <div class="segmented" aria-label="场景选择">
        <button type="button" data-scenario="normal">正常场景</button>
        <button type="button" data-scenario="blocked">阻塞场景</button>
      </div>
      <button type="button" id="reset-button">重置场景</button>
      <button class="danger" type="button" id="shutdown-button">关闭服务</button>
    </div>
  </section>

  <main class="workspace">
    <section class="panel">
      <div class="panel-section">
        <div class="section-heading">
          <h2>World Model</h2>
          <span class="metric" id="world-revision">world:0</span>
        </div>
        <div class="map-frame" id="map-frame">
          <canvas id="world-canvas"></canvas>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="swatch robot"></span>机器人</span>
          <span class="legend-item"><span class="swatch object"></span>物体</span>
          <span class="legend-item"><span class="swatch region"></span>区域</span>
          <span class="legend-item"><span class="swatch obstacle"></span>障碍</span>
        </div>
      </div>
      <div class="panel-section">
        <div class="section-heading">
          <h2>空间实体</h2>
          <span class="metric" id="entity-count">0 entities</span>
        </div>
        <div class="entity-list" id="entity-list"></div>
      </div>
    </section>

    <section class="panel tree-panel">
      <div class="panel-section tree-toolbar">
        <div class="section-heading">
          <h2>显式任务节点树</h2>
          <span class="status-pill" id="session-status">就绪</span>
        </div>
        <div class="metric" id="session-message">Ready</div>
      </div>
      <div class="tree-scroll" id="tree-list"></div>
    </section>

    <aside class="panel side-panel">
      <div class="panel-section">
        <div class="section-heading">
          <h2>任务历史</h2>
          <span class="metric" id="transaction-count">0 transactions</span>
        </div>
        <div class="history-list" id="history-list"></div>
      </div>
      <div class="panel-section">
        <div class="section-heading">
          <h2>Kernel 事件流</h2>
          <span class="metric" id="event-count">0 events</span>
        </div>
        <div class="event-scroll">
          <div class="event-list" id="event-list"></div>
        </div>
      </div>
      <div class="panel-section">
        <div class="section-heading">
          <h2>Artifacts</h2>
        </div>
        <div class="artifact-path" id="artifact-path">-</div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="alert"></div>

  <script>
    const elements = {
      connection: document.getElementById("connection"),
      connectionLabel: document.getElementById("connection-label"),
      taskForm: document.getElementById("task-form"),
      objectSelect: document.getElementById("object-select"),
      destinationSelect: document.getElementById("destination-select"),
      executeButton: document.getElementById("execute-button"),
      resetButton: document.getElementById("reset-button"),
      shutdownButton: document.getElementById("shutdown-button"),
      scenarioButtons: Array.from(document.querySelectorAll("[data-scenario]")),
      status: document.getElementById("session-status"),
      message: document.getElementById("session-message"),
      worldRevision: document.getElementById("world-revision"),
      entityCount: document.getElementById("entity-count"),
      transactionCount: document.getElementById("transaction-count"),
      eventCount: document.getElementById("event-count"),
      entityList: document.getElementById("entity-list"),
      treeList: document.getElementById("tree-list"),
      historyList: document.getElementById("history-list"),
      eventList: document.getElementById("event-list"),
      artifactPath: document.getElementById("artifact-path"),
      mapFrame: document.getElementById("map-frame"),
      canvas: document.getElementById("world-canvas"),
      toast: document.getElementById("toast"),
    };

    const labels = {
      "cup-red": "红色杯子",
      "movable-crate": "可移动箱体",
      "drop-zone": "目标放置区",
      "parking-zone": "临时停放区",
    };

    const statusLabels = {
      idle: "就绪",
      running: "执行中",
      succeeded: "成功",
      failed: "失败",
      blocked: "阻塞",
      cancelled: "已取消",
      error: "异常",
      pending: "等待",
    };

    let currentState = null;
    let toastTimer = null;

    async function api(path, options = {}) {
      const response = await fetch(path, {
        cache: "no-store",
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {}),
        },
        ...options,
      });
      let payload = {};
      try {
        payload = await response.json();
      } catch (_error) {
        payload = {};
      }
      if (!response.ok) {
        throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
      }
      return payload;
    }

    async function refresh() {
      try {
        const state = await api("/api/state");
        currentState = state;
        setConnected(true);
        render(state);
      } catch (error) {
        setConnected(false);
        showToast(error.message);
      }
    }

    function setConnected(connected) {
      elements.connection.classList.toggle("connected", connected);
      elements.connection.classList.toggle("disconnected", !connected);
      elements.connectionLabel.textContent = connected ? "已连接" : "连接断开";
    }

    function render(state) {
      const running = state.status === "running";
      elements.status.className = `status-pill ${state.status}`;
      elements.status.textContent = statusLabels[state.status] || state.status;
      elements.message.textContent = state.message || "-";
      elements.worldRevision.textContent = state.world.snapshot_ref;
      elements.transactionCount.textContent = `${state.transactions} transactions`;
      elements.artifactPath.textContent = state.artifacts_dir;
      elements.executeButton.disabled = running;
      elements.objectSelect.disabled = running;
      elements.destinationSelect.disabled = running;
      elements.resetButton.disabled = running;
      elements.scenarioButtons.forEach((button) => {
        button.disabled = running;
        button.classList.toggle("active", button.dataset.scenario === state.scenario);
      });
      renderSelectors(state.world.entities);
      renderWorld(state.world);
      renderEntities(state.world.entities);
      renderTree(state.tree);
      renderHistory(state.history);
      renderEvents(state.tree.events);
    }

    function renderSelectors(entities) {
      const objects = entities.filter(
        (entity) => entity.kind === "object" && entity.properties.movable
      );
      const regions = entities.filter((entity) => entity.kind === "region");
      syncSelect(elements.objectSelect, objects);
      syncSelect(elements.destinationSelect, regions);
    }

    function syncSelect(select, entities) {
      const previous = select.value;
      const signature = entities.map((entity) => entity.entity_id).join("|");
      if (select.dataset.signature === signature) {
        return;
      }
      select.replaceChildren();
      entities.forEach((entity) => {
        const option = document.createElement("option");
        option.value = entity.entity_id;
        option.textContent = labels[entity.entity_id] || entity.entity_id;
        option.title = entity.entity_id;
        select.appendChild(option);
      });
      select.dataset.signature = signature;
      if (entities.some((entity) => entity.entity_id === previous)) {
        select.value = previous;
      }
    }

    function renderWorld(world) {
      const canvas = elements.canvas;
      const frame = elements.mapFrame.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const cssWidth = Math.max(300, Math.floor(frame.width));
      const cssHeight = Math.max(240, Math.floor(frame.height));
      canvas.width = Math.floor(cssWidth * dpr);
      canvas.height = Math.floor(cssHeight * dpr);
      const context = canvas.getContext("2d");
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      context.clearRect(0, 0, cssWidth, cssHeight);

      const grid = world.grid;
      const cellWidth = cssWidth / grid.width;
      const cellHeight = cssHeight / grid.height;
      context.fillStyle = "#f9fbfc";
      context.fillRect(0, 0, cssWidth, cssHeight);

      context.strokeStyle = "#e2e7ea";
      context.lineWidth = 1;
      for (let x = 0; x <= grid.width; x += 1) {
        context.beginPath();
        context.moveTo(x * cellWidth, 0);
        context.lineTo(x * cellWidth, cssHeight);
        context.stroke();
      }
      for (let y = 0; y <= grid.height; y += 1) {
        context.beginPath();
        context.moveTo(0, y * cellHeight);
        context.lineTo(cssWidth, y * cellHeight);
        context.stroke();
      }

      context.fillStyle = "#68757d";
      grid.static_occupied.forEach(([x, y]) => {
        context.fillRect(
          x * cellWidth + 1,
          cssHeight - (y + 1) * cellHeight + 1,
          cellWidth - 2,
          cellHeight - 2
        );
      });

      const project = (pose) => ({
        x: ((pose.x - grid.origin_x) / grid.resolution) * cellWidth,
        y: cssHeight - ((pose.y - grid.origin_y) / grid.resolution) * cellHeight,
      });
      const scale = Math.min(cellWidth, cellHeight) / grid.resolution;

      world.entities
        .filter((entity) => entity.kind === "region")
        .forEach((entity) => {
          const point = project(entity.pose);
          context.save();
          context.beginPath();
          context.arc(point.x, point.y, Math.max(9, entity.radius * scale), 0, Math.PI * 2);
          context.fillStyle = "rgba(58, 145, 96, 0.13)";
          context.strokeStyle = "#3a9160";
          context.lineWidth = 2;
          context.setLineDash([5, 4]);
          context.fill();
          context.stroke();
          context.restore();
          drawLabel(context, labels[entity.entity_id] || entity.entity_id, point.x, point.y - 13);
        });

      world.entities
        .filter((entity) => entity.kind === "object")
        .forEach((entity) => {
          const point = project(entity.pose);
          const radius = Math.max(6, entity.radius * scale);
          context.save();
          if (entity.properties.nav_obstacle) {
            context.fillStyle = "#c38b3d";
            context.strokeStyle = "#744d17";
            context.lineWidth = 2;
            context.fillRect(point.x - radius, point.y - radius, radius * 2, radius * 2);
            context.strokeRect(point.x - radius, point.y - radius, radius * 2, radius * 2);
          } else {
            context.beginPath();
            context.arc(point.x, point.y, radius, 0, Math.PI * 2);
            context.fillStyle = "#d94e57";
            context.strokeStyle = "#8e242b";
            context.lineWidth = 2;
            context.fill();
            context.stroke();
          }
          if (world.robot.held_object_id === entity.entity_id) {
            context.beginPath();
            context.arc(point.x, point.y, radius + 4, 0, Math.PI * 2);
            context.strokeStyle = "#087f8c";
            context.lineWidth = 2;
            context.setLineDash([3, 3]);
            context.stroke();
          }
          context.restore();
          drawLabel(context, labels[entity.entity_id] || entity.entity_id, point.x, point.y + radius + 12);
        });

      const robotPoint = project(world.robot.base_pose);
      const angle = -world.robot.base_pose.yaw;
      context.save();
      context.translate(robotPoint.x, robotPoint.y);
      context.rotate(angle);
      context.beginPath();
      context.moveTo(13, 0);
      context.lineTo(-9, -9);
      context.lineTo(-6, 0);
      context.lineTo(-9, 9);
      context.closePath();
      context.fillStyle = "#157a9b";
      context.strokeStyle = "#0c4f68";
      context.lineWidth = 2;
      context.fill();
      context.stroke();
      context.restore();
      drawLabel(context, "robot", robotPoint.x, robotPoint.y + 20);
    }

    function drawLabel(context, text, x, y) {
      context.save();
      context.font = '11px "Segoe UI", "Microsoft YaHei UI", sans-serif';
      context.textAlign = "center";
      context.textBaseline = "middle";
      const width = context.measureText(text).width + 8;
      context.fillStyle = "rgba(255, 255, 255, 0.88)";
      context.fillRect(x - width / 2, y - 8, width, 16);
      context.fillStyle = "#26343c";
      context.fillText(text, x, y);
      context.restore();
    }

    function renderEntities(entities) {
      elements.entityCount.textContent = `${entities.length} entities`;
      elements.entityList.replaceChildren();
      entities.forEach((entity) => {
        const row = document.createElement("div");
        row.className = "entity-row";
        const copy = document.createElement("div");
        const name = document.createElement("div");
        name.className = "entity-name";
        name.textContent = labels[entity.entity_id] || entity.entity_id;
        const detail = document.createElement("div");
        detail.className = "entity-detail";
        detail.textContent = `${entity.entity_id} · ${entity.kind} · v${entity.version}`;
        copy.append(name, detail);
        const pose = document.createElement("div");
        pose.className = "entity-pose";
        pose.textContent = `${entity.pose.x.toFixed(2)}, ${entity.pose.y.toFixed(2)}`;
        row.append(copy, pose);
        elements.entityList.appendChild(row);
      });
    }

    function renderTree(tree) {
      elements.treeList.replaceChildren();
      if (!tree.root_id) {
        const empty = document.createElement("div");
        empty.className = "tree-empty";
        empty.textContent = "尚无任务树";
        elements.treeList.appendChild(empty);
        return;
      }
      const nodes = new Map(tree.nodes.map((node) => [node.node_id, node]));
      const children = new Map();
      tree.edges
        .slice()
        .sort((left, right) => left.order - right.order)
        .forEach((edge) => {
          if (!children.has(edge.parent_id)) {
            children.set(edge.parent_id, []);
          }
          children.get(edge.parent_id).push(edge);
        });
      const visited = new Set();
      const appendNode = (nodeId, depth, edgeKind) => {
        if (visited.has(nodeId) || !nodes.has(nodeId)) {
          return;
        }
        visited.add(nodeId);
        const node = nodes.get(nodeId);
        const row = document.createElement("div");
        row.className = `tree-row ${edgeKind === "repair" ? "repair" : ""}`;
        row.style.setProperty("--depth", String(depth));

        const copy = document.createElement("div");
        copy.className = "tree-copy";
        const title = document.createElement("div");
        title.className = "tree-title";
        const taskType = document.createElement("span");
        taskType.textContent = node.task_type;
        title.appendChild(taskType);
        if (edgeKind === "repair") {
          const repair = document.createElement("span");
          repair.className = "repair-label";
          repair.textContent = "REPAIR";
          title.appendChild(repair);
        }
        const nodeIdLine = document.createElement("div");
        nodeIdLine.className = "tree-id";
        nodeIdLine.textContent = node.node_id;
        copy.append(title, nodeIdLine);

        const runtime = document.createElement("div");
        runtime.className = "tree-runtime";
        const status = document.createElement("span");
        status.className = `node-status ${node.status}`;
        status.textContent = statusLabels[node.status] || node.status;
        const attempts = document.createElement("span");
        attempts.className = "attempts";
        attempts.textContent = `A${node.attempts} · R${node.repairs}`;
        runtime.append(status, attempts);
        row.append(copy, runtime);
        elements.treeList.appendChild(row);

        (children.get(nodeId) || []).forEach((edge) => {
          appendNode(edge.child_id, depth + 1, edge.kind);
        });
      };
      appendNode(tree.root_id, 0, null);
    }

    function renderHistory(history) {
      elements.historyList.replaceChildren();
      if (!history.length) {
        const empty = document.createElement("div");
        empty.className = "list-empty";
        empty.textContent = "尚无任务记录";
        elements.historyList.appendChild(empty);
        return;
      }
      history.slice().reverse().forEach((item) => {
        const row = document.createElement("div");
        row.className = "history-item";
        const line = document.createElement("div");
        line.className = "history-line";
        const task = document.createElement("span");
        task.className = "history-task";
        task.textContent = `${labels[item.object_id] || item.object_id} → ${labels[item.destination_id] || item.destination_id}`;
        const status = document.createElement("span");
        status.className = `node-status ${item.status}`;
        status.textContent = statusLabels[item.status] || item.status;
        line.append(task, status);
        const meta = document.createElement("div");
        meta.className = "history-meta";
        meta.textContent = `${item.task_id} · ${item.transactions} transactions`;
        row.append(line, meta);
        elements.historyList.appendChild(row);
      });
    }

    function renderEvents(events) {
      elements.eventCount.textContent = `${events.length} events`;
      elements.eventList.replaceChildren();
      if (!events.length) {
        const empty = document.createElement("div");
        empty.className = "list-empty";
        empty.textContent = "尚无 Kernel 事件";
        elements.eventList.appendChild(empty);
        return;
      }
      events.slice(-80).reverse().forEach((event) => {
        const row = document.createElement("div");
        row.className = "event-item";
        const line = document.createElement("div");
        line.className = "event-line";
        const type = document.createElement("span");
        type.className = "event-type";
        type.textContent = event.event_type;
        const sequence = document.createElement("span");
        sequence.className = "event-sequence";
        sequence.textContent = `#${event.sequence}`;
        line.append(type, sequence);
        const node = document.createElement("div");
        node.className = "event-node";
        node.textContent = event.node_id || "kernel";
        row.append(line, node);
        elements.eventList.appendChild(row);
      });
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        elements.toast.classList.remove("visible");
      }, 4200);
    }

    elements.taskForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await api("/api/tasks", {
          method: "POST",
          body: JSON.stringify({
            object_id: elements.objectSelect.value,
            destination_id: elements.destinationSelect.value,
          }),
        });
        await refresh();
      } catch (error) {
        showToast(error.message);
      }
    });

    elements.scenarioButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        try {
          await api("/api/reset", {
            method: "POST",
            body: JSON.stringify({ scenario: button.dataset.scenario }),
          });
          await refresh();
        } catch (error) {
          showToast(error.message);
        }
      });
    });

    elements.resetButton.addEventListener("click", async () => {
      try {
        await api("/api/reset", {
          method: "POST",
          body: JSON.stringify({ scenario: currentState?.scenario || "normal" }),
        });
        await refresh();
      } catch (error) {
        showToast(error.message);
      }
    });

    elements.shutdownButton.addEventListener("click", async () => {
      if (!window.confirm("关闭本地 Task Recursive Tree 服务？")) {
        return;
      }
      try {
        await api("/api/shutdown", {
          method: "POST",
          body: "{}",
        });
        elements.connectionLabel.textContent = "正在关闭";
      } catch (error) {
        showToast(error.message);
      }
    });

    const resizeObserver = new ResizeObserver(() => {
      if (currentState) {
        renderWorld(currentState.world);
      }
    });
    resizeObserver.observe(elements.mapFrame);

    refresh();
    setInterval(refresh, 500);
  </script>
</body>
</html>
