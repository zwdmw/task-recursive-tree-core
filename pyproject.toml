[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "task-recursive-tree"
version = "0.1.0"
description = "A reference recursive task-tree runtime for mobile manipulation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Task Recursive Tree"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trt-demo = "task_recursive_tree.demo:main"
trt-server = "task_recursive_tree.web.server:main"
trt-gemini-er2-server = "task_recursive_tree.integrations.gemini_er2.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
task_recursive_tree = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
